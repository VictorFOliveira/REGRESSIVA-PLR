<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regressiva PLR</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    #timer {
      font-size: clamp(4rem, 18vw, 16rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.07em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
    }
  </style>
</head>
<body>
  <main id="timer" aria-label="Contagem regressiva">00:00:00</main>

  <script>
    // 30/09/2026 às 12:00 no horário de Fortaleza/Brasília (UTC-03:00)
    const target = new Date('2026-09-30T12:00:00-03:00').getTime();
    const timer = document.getElementById('timer');

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateTimer() {
      const remaining = Math.max(0, target - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timer.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

      if (remaining <= 0) {
        clearInterval(interval);
      }
    }

    updateTimer();
    const interval = setInterval(updateTimer, 250);
  </script>
</body>
</html>
